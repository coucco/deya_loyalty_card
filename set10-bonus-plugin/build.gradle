plugins {
    id 'java'
}

version = project.findProperty('pluginVersion') ?: '1.0.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // собираем под Java 8 (на кассах Set10 плагины работают на Java 8), даже если Gradle запущен на более новой JDK
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 8
    }
}

sourceSets {
    // Заглушка org.slf4j.Logger только для компиляции: на кассе настоящий slf4j уже есть
    // и Logger подставляет сама касса. В jar плагина заглушка НЕ попадает.
    stubs {
        java.srcDir 'src/stubs/java'
    }
}

def set10Api = files('libs/set10pos-api-0.0.0_DO_NOT_CHANGE_VERSION-SNAPSHOT.jar')

dependencies {
    compileOnly set10Api
    compileOnly sourceSets.stubs.output
    testImplementation set10Api
    testImplementation sourceSets.stubs.output
}

// Тесты написаны без внешних библиотек (в закрытой сети не нужен JUnit): обычный main-класс.
test.enabled = false

task selfTest(type: JavaExec) {
    group = 'verification'
    description = 'Запускает самопроверку плагина (без внешних зависимостей)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.deya.loyalty.SelfTest'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}
check.dependsOn selfTest

jar {
    archiveFileName = 'DeyaBonusAccrualPlugin.jar'
    manifest {
        def machine = 'unknown'
        try { machine = InetAddress.getLocalHost().getCanonicalHostName() } catch (Exception ignored) { }
        def vendorEmail = project.findProperty('vendorEmail') ?: ''
        def vendorPhone = project.findProperty('vendorPhone') ?: ''
        def attrs = [
                'Build-Date'            : new Date().format('dd.MM.yyyy HH:mm:ss'),
                'Implementation-Version': version,
                'Implementation-Vendor' : project.findProperty('vendorName') ?: 'TRC Deya',
                'Build-Machine'         : machine,
                'Project'               : project.name,
                'Revision'              : project.findProperty('gitRevision') ?: 'n/a',
                'Branch'                : project.findProperty('gitBranch') ?: 'n/a'
        ]
        if (vendorEmail) attrs['Vendor-Email'] = vendorEmail
        if (vendorPhone) attrs['Vendor-Phone'] = vendorPhone
        attributes(attrs)
    }
}
